[package]
name = "gitshrub"
version = "1.4.0"
edition = "2024"
description = "The \"don't touch my garbage\" git client"
license = "MIT"
repository = "https://github.com/AJenbo/GitShrub"
homepage = "https://github.com/AJenbo/GitShrub"
readme = "README.md"
keywords = ["git", "gui", "history", "viewer", "rebase"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = ["gitk/", "docs/", "AGENTS.md"]

[dependencies]
eframe = { version = "0.34", default-features = true }
egui = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
